<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile modal demo</title>
<link rel="stylesheet" href="pnv-support-profile.css?v=11">
<style>body{margin:0;background:#0e1621;min-height:100vh;font-family:tahoma}</style>
</head>
<body>
<div id="profileHost" style="display:block">
<div class="profileOverlay"></div>
<div class="profileModal">
<div class="profileHeader">👤 اشتراک‌های demo_user<button type="button" class="profileCloseBtn">✕</button></div>
<div class="subCard">
<div class="subCardHead">
<div class="subStatusRow">
<span class="subStatus subStatusActive">فعال</span>
<div class="subCardMenuWrap is-open">
<button type="button" class="subCardMenuBtn">⋮</button>
<div class="subCardMenu"><button type="button" class="subCardMenuItem subCardMenuItem--danger">حذف</button></div>
</div>
</div>
<div class="subPlan">پلن ۳۰ روزه</div>
</div>
<div class="subMeta"><div><b>نام کانفیگ:</b> user-demo</div></div>
<div class="subLinkField">
<input class="subLinkInput" readonly value="https://vip.example.com/sub/abc123456789012345678901234567890">
<button type="button" class="subLinkCopyBtn"><span class="subLinkCopyIcon">⎘</span></button>
</div>
</div>
</div>
</div>
</body>
</html>
