name: PHP tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  php-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Run test suite
        run: |
          set -euo pipefail
          for test in tests/*_test.php; do
            echo "==> $test"
            php "$test"
          done
          python3 tests/renew_step3_deploy_safety_test.py
          python3 tests/renew_policy_deploy_safety_test.py
          python3 tests/bank_connection_deploy_safety_test.py
      - name: Test Tejarat read-only worker
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check requests==2.32.3
          cd services/tejarat-browser-worker
          PYTHONPATH=. python3 -m unittest discover -s tests -p 'test_*.py' -v
