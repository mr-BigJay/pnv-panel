name: PHP tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  php-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Lint server3 deployment helpers
        run: |
          python3 -m py_compile scripts/pnv_pr28_merge_production.py
          bash -n scripts/deploy-pr28-server3.sh
      - name: Run test suite
        run: |
          set -euo pipefail
          for test in tests/*_test.php; do
            echo "==> $test"
            php "$test"
          done
