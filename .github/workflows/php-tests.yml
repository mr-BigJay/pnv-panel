name: PHP tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  php-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Run test suite
        run: |
          set -euo pipefail
          for test in tests/*_test.php; do
            echo "==> $test"
            php "$test"
          done
