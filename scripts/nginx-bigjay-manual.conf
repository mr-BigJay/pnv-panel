# Paste at SERVER level (443 block), AFTER the closing "}" of location ^~ /admin/
# NOT inside /admin/ — nginx will error: bigjay_controller is outside location /admin/
#
# REMOVE all old location blocks that mention bigjay_controller, then add:

    # PNV_BIGJAY_PATCHED — bigjay_controller admin routing
    location = /bigjay_controller {
        return 301 /bigjay_controller/;
    }
    location ^~ /bigjay_controller/ {
        try_files $uri $uri/ /bigjay_controller/index.php?$query_string;
        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/run/php/php8.3-fpm.sock;
            include fastcgi_params;
        }
    }

