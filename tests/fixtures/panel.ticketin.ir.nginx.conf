# Simulated production vhost (443 block excerpt)
server {
    listen 443 ssl http2;
    server_name panel.ticketin.ir;
    root /var/www/html;
    index index.php index.html;
    client_max_body_size 20M;
    underscores_in_headers on;

    location = /admin.php {
        return 301 /bigjay_controller/;
    }
    location ^~ /admin/ {
        deny all;
        return 404;
    }
    location = /bigjay_controller {
        return 301 /bigjay_controller/;
    }
    location = /bigjay_controller/ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/bigjay_controller/index.php;
        include fastcgi_params;
    }
    location ^~ /bigjay_controller/ {
        location = /bigjay_controller/sw.js {
            default_type application/javascript;
            add_header Cache-Control "no-cache";
        }
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
}
