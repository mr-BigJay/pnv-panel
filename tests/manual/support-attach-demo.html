<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support attach demo</title>
<link rel="stylesheet" href="/assets/support-chat/pnv-support-shell.css?v=18">
<style>
body { margin: 0; background: #0e1621; font-family: tahoma, sans-serif; color: #fff; }
.demoBar { padding: 1rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }
.demoBar button { padding: 0.5rem 0.75rem; border-radius: 8px; border: none; background: #3390ec; color: #fff; }
</style>
</head>
<body>
<div class="demoBar">
<button type="button" id="openAttach">Attach sheet</button>
<button type="button" id="openGallery">Gallery editor</button>
<button type="button" id="openCrop">Crop</button>
<button type="button" id="openFile">File composer</button>
</div>
<form id="demoForm" style="display:none">
<input type="hidden" name="csrf" value="demo">
<input type="file" id="demoImageInput" accept="image/*" style="display:none">
</form>
<script src="/support_ui.js?v=48"></script>
<script>
SupportUI.bindImageAttach(document.getElementById('demoForm'), 'demoImageInput', null);
document.getElementById('openAttach').onclick = function(){
  document.getElementById('supportAttachSheet').hidden = false;
};
document.getElementById('openGallery').onclick = function(){
  fetch('/tests/fixtures/sample.pdf').catch(function(){});
  var img = document.getElementById('supportMediaImg');
  img.src = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500"><rect fill="#3390ec" width="800" height="500"/><text x="50%" y="50%" fill="white" font-size="48" text-anchor="middle" dominant-baseline="middle">Preview</text></svg>');
  document.getElementById('supportMediaComposer').hidden = false;
  document.body.classList.add('supportMediaOpen');
};
document.getElementById('openCrop').onclick = function(){
  document.getElementById('supportCropModal').hidden = false;
};
document.getElementById('openFile').onclick = function(){
  var fc = document.getElementById('supportFileComposer');
  document.getElementById('supportFileComposerName').textContent = 'report.docx';
  document.getElementById('supportFileComposerMeta').textContent = 'DOCX · 128 KB';
  fc.hidden = false;
  document.body.classList.add('supportMediaOpen');
};
</script>
</body>
</html>
